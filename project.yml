# XcodeGen spec. Generate the project with `xcodegen generate` (the .xcodeproj is not committed,
# except for its Package.resolved).
name: LLMOnIPhone

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES

# Versions pinned exactly. mlx-swift / mlx-swift-lm / swift-huggingface / swift-transformers
# match mlx-swift-examples' Package.resolved (mlx-swift 0.31.4, mlx-swift-lm 3.31.3).
# URLs match the ones used by the dependent packages to keep a single package identity.
packages:
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    exactVersion: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    exactVersion: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0
  LLMCore:
    path: Packages/LLMCore

targets:
  LLMOnIPhone:
    type: application
    platform: iOS
    sources:
      # Synchronized (buildable) folder: new files are picked up without regenerating.
      - path: App/Sources
        type: syncedFolder
      # Asset catalog, String Catalog, privacy manifest, acknowledgements (synchronized too).
      - path: App/Resources
        type: syncedFolder
      # Not part of the synced folder on purpose.
      - path: App/Info.plist
        buildPhase: none
      - path: App/LLMOnIPhone.entitlements
        buildPhase: none
    dependencies:
      - package: LLMCore
      - package: mlx-swift
        product: MLX
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_NAME: LLMOnIPhone
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).llmoniphone
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait only: the chat layout is designed for it.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: App/LLMOnIPhone.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(SELFTEST_FLAG)
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # UI flows against the DEBUG demo backend, simulator only (scripts/test-ui.sh).
  LLMOnIPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
        type: syncedFolder
    dependencies:
      - target: LLMOnIPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).llmoniphone.uitests
        # Simulator only: never registers an App ID or profile on the signing team.
        SUPPORTED_PLATFORMS: iphonesimulator
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LLMOnIPhone
        SWIFT_VERSION: "6.0"

schemes:
  LLMOnIPhone:
    build:
      targets:
        LLMOnIPhone: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LLMOnIPhoneUITests
    archive:
      config: Release
